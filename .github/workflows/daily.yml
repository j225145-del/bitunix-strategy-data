name: Daily Bitunix Strategy Research

on:
  workflow_dispatch:
  schedule:
    - cron: '50 21 * * *'

permissions:
  contents: write

concurrency:
  group: daily-bitunix-strategy
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run analysis
        env:
          GATEWAY_BASE: https://bitunix-data.j225145.workers.dev
        run: node analyze.mjs

      - name: Commit daily result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json archive/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Daily Bitunix strategy research"
          git push
