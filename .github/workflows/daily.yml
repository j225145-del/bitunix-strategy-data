name: Daily Bitunix Strategy Research

on:
  workflow_dispatch:
  schedule:
    - cron: '40 21 * * *'

permissions:
  contents: write

concurrency:
  group: daily-bitunix-strategy
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run analysis
        env:
          GATEWAY_BASE: https://bitunix-data.j225145.workers.dev
        run: |
          for attempt in 1 2 3; do
            echo "Analysis attempt $attempt / 3"

            if node analyze.mjs; then
              echo "Analysis succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Analysis failed. Waiting 60 seconds before retry..."
              sleep 60
            fi
          done

          echo "Analysis failed after 3 attempts"
          exit 1

      - name: Commit daily result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json archive/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Daily Bitunix strategy research"
          git push